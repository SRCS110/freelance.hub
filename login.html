<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FreelanceHub — Sign In</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="client/css/styles.css"/>
<style>body { overflow: auto; background: #fff; }</style>
</head>
<body>
<canvas id="swirl-canvas"></canvas>

<div id="auth-screen">
  <div class="auth-wrap" style="position:relative;z-index:1">
    <div class="auth-card">
      <div class="auth-logo">FreelanceHub</div>
      <div class="auth-tagline">Your all-in-one business command center</div>

      <div id="auth-error"   class="msg-error" style="display:none"></div>
      <div id="auth-success" class="msg-ok"    style="display:none"></div>

      <div class="form-group">
        <label class="form-label">Email</label>
        <input id="auth-email" type="email" placeholder="you@example.com"/>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input id="auth-pw" type="password" placeholder="••••••••"/>
      </div>

      <button class="btn btn-primary" id="auth-btn" onclick="handleAuth()">Sign In</button>

      <div style="display:block;margin-top:12px">
        <button class="btn" id="google-btn" onclick="googleOAuth.login()"
          style="width:100%;padding:11px;background:#fff;color:#1e293b;border:1px solid #e2e8f0;
                 display:flex;align-items:center;justify-content:center;gap:10px;font-size:14px;
                 border-radius:10px;box-shadow:0 1px 4px #0001">
          <svg width="18" height="18" viewBox="0 0 48 48">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
          </svg>
          Continue with Google
        </button>
      </div>

      <div class="auth-toggle" id="auth-toggle">
        No account? <span class="auth-link" onclick="setMode('signup')">Create one</span>
      </div>
    </div>
  </div>
</div>

<script src="client/js/auth.js"></script>
<script src="client/js/utils.js"></script>
<script>
  let _mode = "login";

  function setMode(m) {
    _mode = m;
    document.getElementById("auth-btn").textContent  = m === "signup" ? "Create Account" : "Sign In";
    document.getElementById("auth-toggle").innerHTML = m === "login"
      ? `No account? <span class="auth-link" onclick="setMode('signup')">Create one</span>`
      : `Have an account? <span class="auth-link" onclick="setMode('login')">Sign in</span>`;
    clearMessages();
  }

  function showError(msg)   { const el = document.getElementById("auth-error");   el.textContent = msg; el.style.display = "block"; }
  function showSuccess(msg) { const el = document.getElementById("auth-success"); el.textContent = msg; el.style.display = "block"; }
  function clearMessages()  {
    document.getElementById("auth-error").style.display   = "none";
    document.getElementById("auth-success").style.display = "none";
  }

  window.handleAuth = async function() {
    const email = document.getElementById("auth-email").value.trim();
    const pw    = document.getElementById("auth-pw").value;
    if (!email || !pw) return;
    clearMessages();
    const btn = document.getElementById("auth-btn");
    btn.textContent = "Please wait…"; btn.disabled = true;
    try {
      if (_mode === "signup") {
        await signUp(email, pw);
        showSuccess("Account created! Sign in below.");
        setMode("login");
      } else {
        const data = await signIn(email, pw);
        if (data?.user) {
          window.location.href = "index.html";
        } else {
          throw new Error("Sign in failed.");
        }
      }
    } catch(e) {
      showError(e.message || "Something went wrong.");
    }
    btn.textContent = _mode === "signup" ? "Create Account" : "Sign In";
    btn.disabled = false;
  };

  async function boot() {
    // If not configured yet, show a clear message instead of a broken screen
    if (!hasConfig()) {
      document.getElementById("auth-error").textContent =
        "Supabase URL and anon key not set. Open client/js/auth.js and fill in SUPABASE_URL and SUPABASE_ANON_KEY.";
      document.getElementById("auth-error").style.display = "block";
      document.getElementById("auth-btn").disabled = true;
      document.getElementById("google-btn").disabled = true;
      startSwirl();
      return;
    }

    const user = await restoreSession().catch(() => null);
    if (user) { window.location.href = "index.html"; return; }

    startSwirl();

    // Handle Google OAuth callback
    if (window.location.hash.includes("access_token")) {
      const token = googleOAuth.handleCallback();
      if (token) { window.location.href = "index.html"; return; }
    }

    document.getElementById("auth-email").addEventListener("keydown", e => { if(e.key==="Enter") handleAuth(); });
    document.getElementById("auth-pw").addEventListener("keydown",    e => { if(e.key==="Enter") handleAuth(); });
  }

  boot();
</script>
</body>
</html>
